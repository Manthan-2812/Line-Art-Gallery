<body class="min-h-screen relative overflow-x-hidden bg-[#080e1d]">
    <!-- Ambient subtle powder / sprinkle light animation -->
    <canvas id="ambient-dust" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <div id="checkout-root" class="max-w-2xl sm:max-w-3xl mx-auto px-4 sm:px-6 py-12 relative z-10"></div>
    <div id="modal-root" class="relative z-50"></div>

    <script>
    // ── Subtle Powder / Sprinkle Light Particle Animation ──────────────────────
    (function () {
        const canvas = document.getElementById('ambient-dust');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const onResize = () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', onResize);

        const PARTICLE_COUNT = 45;
        const COLORS = [
            'rgba(34, 211, 238, ',   // Cyan
            'rgba(167, 139, 250, ',  // Violet
            'rgba(251, 191, 36, ',   // Amber/Gold
            'rgba(244, 114, 182, '   // Rose
        ];

        const particles = Array.from({ length: PARTICLE_COUNT }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: 0.8 + Math.random() * 1.8,
            vx: (Math.random() - 0.5) * 0.35,
            vy: -0.15 - Math.random() * 0.35,
            alpha: 0.1 + Math.random() * 0.35,
            baseAlpha: 0.15 + Math.random() * 0.3,
            pulseSpeed: 0.015 + Math.random() * 0.02,
            pulsePhase: Math.random() * Math.PI * 2,
            colorPrefix: COLORS[Math.floor(Math.random() * COLORS.length)]
        }));

        let animId;
        const animate = () => {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.pulsePhase += p.pulseSpeed;
                const currentAlpha = p.baseAlpha + Math.sin(p.pulsePhase) * 0.15;

                if (p.y < -10) {
                    p.y = height + 10;
                    p.x = Math.random() * width;
                }
                if (p.x < -10) p.x = width + 10;
                if (p.x > width + 10) p.x = -10;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.colorPrefix + Math.max(0.05, Math.min(0.65, currentAlpha)) + ')';
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.colorPrefix + '0.5)';
                ctx.fill();
            }

            animId = requestAnimationFrame(animate);
        };
        animate();
    })();
    </script>

    <script src="utils/products.js"></script>
    <script src="utils/print-master.js"></script>
    <script src="utils/clerk-config.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    
    <script type="text/babel" src="components/AddressModal.js"></script>

    <script type="text/babel">
    (function () {
        const esc = (s) => String(s).replace(/[&<>"']/g, c => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));

        const q       = new URLSearchParams(location.search);
        const artName = q.get('name')  || 'Untitled Artwork';
        const img     = q.get('img')   || '';
        const sku     = q.get('sku')   || '';
        const price   = q.get('price') || '';
        const color   = q.get('color') || '';
        const size    = q.get('size')  || '';
        const root    = document.getElementById('checkout-root');

        const printMaster = (typeof getPrintMasterUrl === 'function') ? getPrintMasterUrl(img) : img;
        window.__ORDER_PRINT_URL = printMaster;

        if (!sku || !price) {
            root.innerHTML =
                '<a href="gallery.html" class="text-cyan-400 hover:underline">&larr; Back to Gallery</a>' +
                '<p class="mt-6 text-slate-300">No item selected. Please pick an artwork and print format from the gallery.</p>';
            return;
        }

        const variant = (window.PRODUCT_VARIANTS || []).find(v => v.sku === sku);
        const vLabel  = variant ? variant.label : (color && size ? `${color} — Size ${size}` : 'T-Shirt Print');
        const vSpec   = variant ? variant.spec  : '100% Combed Cotton • 180 GSM • Front DTG';

        let clerkUserId = '';
        let addressData = null;

        const renderCheckout = () => {
            const addressHtml = addressData 
                ? `<div class="bg-slate-800/60 border border-white/10 p-6 rounded-2xl mb-6 text-slate-300 shadow-lg">
                     <div class="flex justify-between items-center mb-3">
                         <span class="font-bold text-base text-yellow-400 text-white flex items-center gap-2 ">
                              Shipping Address
                         </span>
                         <button id="edit-address-btn" class="text-cyan-400 text-sm font-semibold hover:underline">Edit</button>
                     </div>
                     <p class="text-base font-semibold text-white">${esc(addressData.fullName)} <span class="text-slate-400 font-normal">(${esc(addressData.phone)})</span></p>
                     <p class="text-sm text-slate-300 mt-1">${esc(addressData.address1)} ${addressData.address2 ? ', ' + esc(addressData.address2) : ''}</p>
                     <p class="text-sm text-slate-300">${esc(addressData.city)}, ${esc(addressData.state)} ${esc(addressData.pincode)}</p>
                   </div>`
                : `<div class="bg-red-500/10 border border-red-500/30 p-6 rounded-2xl mb-6 flex justify-between items-center shadow-lg">
                     <div>
                         <span class="text-base font-bold text-red-200 block">Shipping Address Required</span>
                         <span class="text-xs text-red-300/80">Please provide delivery address to proceed</span>
                     </div>
                     <button id="add-address-btn" class="bg-red-500/20 text-red-400 px-4 py-2 rounded-xl text-sm font-bold hover:bg-red-500/30 transition-colors">Add Address</button>
                   </div>`;

            root.innerHTML = `
                <a href="gallery.html" class="inline-flex items-center gap-1.5 text-sm text-slate-400 hover:text-cyan-400 transition-colors font-medium mb-3">&larr; Back to Gallery</a>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-white mb-6 tracking-tight">Checkout</h1>

                <div class="rounded-3xl border border-white/15 bg-slate-900/85 backdrop-blur-md p-6 sm:p-7 mb-6 shadow-2xl">
                    <div class="flex flex-col sm:flex-row gap-5 items-start sm:items-center">
                        <img src="${esc(img)}" alt="" class="w-24 h-24 sm:w-28 sm:h-28 object-cover rounded-2xl border border-white/15 shadow-xl shrink-0" />
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-bold text-cyan-400 uppercase tracking-wider mb-1">Artwork Selected</p>
                            <p class="text-xl sm:text-2xl font-bold text-white mb-2 truncate">${esc(artName)}</p>
                            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Product & Format</p>
                            <p class="text-sm sm:text-base font-semibold text-slate-100 mt-0.5">${esc(vLabel)}${vSpec ? ' — ' + esc(vSpec) : ''}</p>
                        </div>
                    </div>
                    <div class="border-t border-white/10 mt-5 pt-4 flex justify-between items-center">
                        <span class="text-base font-medium text-slate-300">Total Price</span>
                        <span class="text-2xl sm:text-3xl font-extrabold text-cyan-400">₹${esc(price)}</span>
                    </div>
                </div>

                ${addressHtml}

                <div class="bg-slate-900/85 border border-white/10 rounded-2xl p-6 mb-6 shadow-lg">
                    <label class="block text-base font-bold text-yellow-400 mb-1">Email for Receipt & Updates <span class="text-cyan-400">*</span></label>
                    <p class="text-xs text-slate-400 mb-3">Your order invoice and delivery tracking will be sent here.</p>
                    <input id="checkout-email" type="email" required placeholder="you@example.com"
                        class="w-full bg-slate-800/90 border border-slate-600 rounded-xl px-4 py-3 text-base text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition-colors" />
                </div>

                <button id="pay-btn" ${!addressData ? 'disabled' : ''}
                    class="w-full py-4 rounded-2xl text-base sm:text-lg font-bold text-slate-950 hover:opacity-95 transition-all shadow-2xl disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
                    style="background:linear-gradient(135deg,#22d3ee,#818cf8)">
                    Proceed to Payment &rarr;
                </button>
                <p id="pay-status" class="text-xs text-slate-400 text-center mt-3"></p>
            `;

            // Re-bind email if Clerk knows it
            if (window.Clerk && window.Clerk.user) {
                const email = window.Clerk.user.primaryEmailAddress && window.Clerk.user.primaryEmailAddress.emailAddress;
                if (email) {
                    const el = document.getElementById('checkout-email');
                    if (el && !el.value) el.value = email;
                }
            }

            // Bind Address buttons
            const openModal = () => {
                const mRoot = document.getElementById('modal-root');
                const close = () => ReactDOM.unmountComponentAtNode(mRoot);
                const onSaved = (addr) => {
                    addressData = addr;
                    renderCheckout();
                };
                ReactDOM.render(
                    <window.AddressModal address={addressData} onClose={close} onSaved={onSaved} />,
                    mRoot
                );
            };

            const addBtn = document.getElementById('add-address-btn');
            if (addBtn) addBtn.addEventListener('click', openModal);
            
            const editBtn = document.getElementById('edit-address-btn');
            if (editBtn) editBtn.addEventListener('click', openModal);

            const payBtn = document.getElementById('pay-btn');
            const payStatus = document.getElementById('pay-status');
            const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

            const setStatus = (msg, tone) => {
                const colors = { info: 'text-slate-400', err: 'text-red-400', ok: 'text-emerald-400' };
                payStatus.className = `text-[11px] ${colors[tone] || colors.info} text-center mt-3`;
                payStatus.textContent = msg;
            };

            if (payBtn) payBtn.addEventListener('click', async () => {
                const emailEl = document.getElementById('checkout-email');
                const emailVal = ((emailEl && emailEl.value) || '').trim();
                if (!EMAIL_RE.test(emailVal)) {
                    setStatus('Please enter a valid email first.', 'err');
                    if (emailEl) emailEl.focus();
                    return;
                }
                if (!addressData) {
                    setStatus('Please add a shipping address first.', 'err');
                    return;
                }

                payBtn.disabled = true;
                setStatus('Preparing secure payment…', 'info');

                try {
                    const res = await fetch('/api/create-order', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sku,
                            email:    emailVal,
                            artId:    q.get('art') || '',
                            artName,
                            printUrl: window.__ORDER_PRINT_URL || img,
                            clerkUserId
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Order creation failed');

                    const rzp = new Razorpay({
                        key:         data.keyId,
                        order_id:    data.orderId,
                        amount:      data.amount,
                        currency:    data.currency,
                        name:        'Line and Layer Gallery',
                        description: `${artName} — ${vLabel}`,
                        prefill:     { email: emailVal, contact: addressData.phone || '' },
                        theme:       { color: '#06b6d4' },
                        handler: async function (response) {
                            setStatus('Verifying payment & securing order…', 'info');
                            try {
                                const vr = await fetch('/api/verify-payment', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        razorpay_order_id:   response.razorpay_order_id,
                                        razorpay_payment_id: response.razorpay_payment_id,
                                        razorpay_signature:  response.razorpay_signature
                                    })
                                });
                                const vd = await vr.json();
                                if (!vr.ok || !vd.ok) throw new Error(vd.error || 'Verification failed');
                                
                                // Render Full Custom Invoice & Receipt View
                                renderSuccessInvoice({
                                    orderId:     vd.orderId || response.razorpay_order_id,
                                    paymentId:   vd.paymentId || response.razorpay_payment_id,
                                    artName:     artName,
                                    imgUrl:      img,
                                    vLabel:      vLabel,
                                    vSpec:       vSpec,
                                    price:       price,
                                    email:       emailVal,
                                    shipping:    addressData,
                                    date:        new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
                                });
                            } catch (err) {
                                setStatus('Payment captured but verification failed: ' + err.message +
                                          '. Please contact support with payment id ' + response.razorpay_payment_id, 'err');
                            }
                        },
                        modal: {
                            ondismiss: function () {
                                payBtn.disabled = false;
                                setStatus('Payment cancelled.', 'info');
                            }
                        }
                    });

                    rzp.on('payment.failed', function (resp) {
                        setStatus('Payment failed: ' + ((resp.error && resp.error.description) || 'unknown error'), 'err');
                        payBtn.disabled = false;
                    });

                    rzp.open();
                    setStatus('', 'info');
                    payBtn.disabled = false;
                } catch (err) {
                    setStatus(err.message || 'Something went wrong. Please try again.', 'err');
                    payBtn.disabled = false;
                }
            });
        };

        const renderSuccessInvoice = (info) => {
            const sh = info.shipping || {};
            root.innerHTML = `
                <div class="bg-slate-900 border border-white/15 rounded-2xl p-6 sm:p-8 shadow-2xl printable-receipt">
                    <div class="flex items-center justify-between border-b border-white/10 pb-5 mb-6">
                        <div>
                            <span class="inline-block bg-emerald-500/20 text-emerald-400 text-xs font-bold px-3 py-1 rounded-full mb-2">
                                ✓ Payment Confirmed
                            </span>
                            <h1 class="text-2xl font-extrabold text-white">Order Receipt & Invoice</h1>
                            <p class="text-xs text-slate-400 mt-1">Line and Layer Gallery — Order #${esc(info.orderId)}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-slate-400">Date</p>
                            <p class="text-xs font-semibold text-white">${esc(info.date)}</p>
                            <p class="text-[11px] text-slate-400 mt-1">Payment ID: <span class="text-cyan-400 font-mono">${esc(info.paymentId)}</span></p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6 bg-slate-800/40 p-4 rounded-xl border border-white/5">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Billed & Shipped To</p>
                            <p class="text-sm font-bold text-white">${esc(sh.fullName || 'Valued Customer')}</p>
                            <p class="text-xs text-slate-300">${esc(sh.address1 || '')} ${sh.address2 ? ', ' + esc(sh.address2) : ''}</p>
                            <p class="text-xs text-slate-300">${esc(sh.city || '')}, ${esc(sh.state || '')} - ${esc(sh.pincode || '')}</p>
                            <p class="text-xs text-slate-400 mt-1">Phone: ${esc(sh.phone || 'N/A')}</p>
                            <p class="text-xs text-slate-400">Email: ${esc(info.email || '')}</p>
                        </div>
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Fulfillment Status</p>
                            <p class="text-sm font-semibold text-cyan-300 flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                                Sent for Printing & Framing
                            </p>
                            <p class="text-xs text-slate-400 mt-2">Estimated Delivery: 5–7 Business Days</p>
                            <p class="text-xs text-slate-400">Carrier: QikInk Express Shipping (Prepaid)</p>
                        </div>
                    </div>

                    <div class="border border-white/10 rounded-xl overflow-hidden mb-6">
                        <table class="w-full text-left text-xs text-slate-300">
                            <thead class="bg-slate-800 text-slate-400 font-bold uppercase tracking-wider">
                                <tr>
                                    <th class="p-3">Artwork Item</th>
                                    <th class="p-3 text-center">Format / Specs</th>
                                    <th class="p-3 text-center">Qty</th>
                                    <th class="p-3 text-right">Amount</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-white/5">
                                <tr>
                                    <td class="p-3 flex items-center gap-3">
                                        <img src="${esc(info.imgUrl)}" alt="" class="w-12 h-12 rounded object-cover border border-white/10" />
                                        <span class="font-bold text-white text-sm">${esc(info.artName)}</span>
                                    </td>
                                    <td class="p-3 text-center">
                                        <span class="font-medium text-slate-200">${esc(info.vLabel)}</span>
                                        <div class="text-[10px] text-slate-400">${esc(info.vSpec)}</div>
                                    </td>
                                    <td class="p-3 text-center font-bold">1</td>
                                    <td class="p-3 text-right font-bold text-white">₹${esc(info.price)}</td>
                                </tr>
                            </tbody>
                            <tfoot class="bg-slate-800/80 font-semibold text-slate-200">
                                <tr>
                                    <td colspan="3" class="p-3 text-right text-slate-400">Subtotal</td>
                                    <td class="p-3 text-right">₹${esc(info.price)}</td>
                                </tr>
                                <tr>
                                    <td colspan="3" class="p-3 text-right text-slate-400">Express Delivery</td>
                                    <td class="p-3 text-right text-emerald-400">FREE</td>
                                </tr>
                                <tr class="border-t border-white/10 text-base font-extrabold text-white">
                                    <td colspan="3" class="p-3 text-right text-cyan-400">Total Paid</td>
                                    <td class="p-3 text-right text-cyan-400">₹${esc(info.price)}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>

                    <div class="flex flex-col sm:flex-row gap-3 pt-2 mb-6 no-print">
                        <button onclick="window.print()" class="flex-1 bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                            Print / Save Receipt PDF
                        </button>
                        <a href="gallery.html" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-semibold py-3 rounded-xl transition-colors text-center flex items-center justify-center">
                            &larr; Back to Gallery
                        </a>
                    </div>

                    <!-- Post-Purchase Rating Card -->
                    <div id="rating-card" class="bg-slate-800/40 border border-white/10 rounded-xl p-5 text-center no-print">
                        <h3 class="text-sm font-bold text-white mb-1">How was your experience?</h3>
                        <p class="text-xs text-slate-400 mb-3">Rate Line and Layer Gallery to help other art collectors</p>
                        
                        <div class="flex justify-center gap-2 mb-3" id="star-container">
                            ${[1, 2, 3, 4, 5].map(star => `
                                <button type="button" data-star="${star}" class="star-btn text-2xl text-slate-600 hover:text-amber-400 transition-transform hover:scale-125 focus:outline-none">
                                    ★
                                </button>
                            `).join('')}
                        </div>
                        
                        <div id="rating-feedback-box" class="hidden max-w-sm mx-auto">
                            <textarea id="rating-comment" rows="2" placeholder="Optional: Leave a brief review or feedback..."
                                class="w-full bg-slate-900 border border-white/10 rounded-lg p-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition-colors mb-2"></textarea>
                            <button id="submit-rating-btn" class="w-full py-2 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-bold rounded-lg text-xs transition-all shadow-md">
                                Submit Rating
                            </button>
                        </div>
                        <div id="rating-thanks" class="hidden text-xs font-bold text-emerald-400 mt-2">
                            ✓ Thank you for your feedback! Your rating is recorded.
                        </div>
                    </div>
                </div>
            `;

            // Bind Rating interactions
            let selectedStars = 0;
            const starBtns = document.querySelectorAll('.star-btn');
            const feedbackBox = document.getElementById('rating-feedback-box');
            const thanksBox = document.getElementById('rating-thanks');
            const submitRatingBtn = document.getElementById('submit-rating-btn');

            const highlightStars = (rating) => {
                starBtns.forEach(btn => {
                    const val = parseInt(btn.getAttribute('data-star'));
                    if (val <= rating) {
                        btn.className = 'star-btn text-2xl text-amber-400 transition-transform focus:outline-none';
                    } else {
                        btn.className = 'star-btn text-2xl text-slate-600 hover:text-amber-400 transition-transform focus:outline-none';
                    }
                });
            };

            starBtns.forEach(btn => {
                btn.addEventListener('mouseenter', () => {
                    const val = parseInt(btn.getAttribute('data-star'));
                    highlightStars(val);
                });
                btn.addEventListener('mouseleave', () => {
                    highlightStars(selectedStars);
                });
                btn.addEventListener('click', () => {
                    selectedStars = parseInt(btn.getAttribute('data-star'));
                    highlightStars(selectedStars);
                    if (feedbackBox) feedbackBox.classList.remove('hidden');
                });
            });

            if (submitRatingBtn) {
                submitRatingBtn.addEventListener('click', async () => {
                    if (!selectedStars) return;
                    submitRatingBtn.disabled = true;
                    submitRatingBtn.textContent = 'Submitting…';
                    const feedback = (document.getElementById('rating-comment') || {}).value || '';
                    try {
                        await fetch('/api/submit-rating', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                stars: selectedStars,
                                feedback: feedback,
                                orderId: info.orderId,
                                artName: info.artName
                            })
                        });
                    } catch (e) {
                        console.error('Failed to submit rating:', e);
                    }
                    if (feedbackBox) feedbackBox.classList.add('hidden');
                    if (thanksBox) thanksBox.classList.remove('hidden');
                });
            }
        };

        const renderLoginPrompt = () => {
            root.innerHTML = `
                <a href="gallery.html" class="text-sm text-slate-400 hover:text-cyan-400 transition-colors">&larr; Back to Gallery</a>
                <div class="mt-8 bg-slate-900/90 border border-white/10 rounded-2xl p-8 sm:p-10 text-center shadow-2xl">
                    <div class="w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-400/30 text-cyan-300 flex items-center justify-center mx-auto mb-5">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">Sign in to Checkout</h1>
                    <p class="text-sm text-slate-400 max-w-sm mx-auto mb-8">Sign in or create an account to save your delivery address, secure your payment, and track fulfillment.</p>
                    <button id="checkout-signin-btn" class="w-full sm:w-auto px-10 py-3.5 text-base font-bold text-white rounded-xl shadow-lg transition-all hover:scale-[1.02]" style="background:linear-gradient(135deg,#06b6d4,#6366f1)">
                        Sign In / Sign Up &rarr;
                    </button>
                </div>
            `;
            document.getElementById('checkout-signin-btn').addEventListener('click', () => {
                if (window.Clerk) window.Clerk.openSignIn({ appearance: window.CLERK_APPEARANCE });
            });
        };

        if (window.__clerkReady) {
            window.__clerkReady.then(async (clerk) => {
                if (clerk.user) {
                    clerkUserId = clerk.user.id;
                    try {
                        const token = await clerk.session.getToken();
                        const res = await fetch('/api/get-address', {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        addressData = data.address || null;
                    } catch (e) {
                        console.error('Failed to fetch address:', e);
                    }
                    renderCheckout();
                } else {
                    renderLoginPrompt();
                }
                
                clerk.addListener(({ user }) => {
                    if (!user && clerkUserId) {
                        // User logged out
                        clerkUserId = '';
                        addressData = null;
                        renderLoginPrompt();
                    } else if (user && !clerkUserId) {
                        // User just logged in
                        window.location.reload();
                    }
                });
            }).catch(() => {
                root.innerHTML = '<p class="text-red-400 mt-10">Failed to load authentication. Please refresh.</p>';
            });
        }
    })();
    </script>
</body>
</html>
