<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#070d1e" />
      <stop offset="100%" stop-color="#02050f" />
    </linearGradient>

    <!-- Cyan to Electric Blue Gradient -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Secondary Layer Violet/Indigo Gradient -->
    <linearGradient id="violetIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Gold Foil Accent -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Ambient Center Light -->
    <radialGradient id="ambientLight" cx="42%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="124" fill="url(#bgGradient)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6" />
  
  <!-- Subtle Ambient Glow -->
  <rect width="512" height="512" rx="124" fill="url(#ambientLight)" />

  <!-- Geometric Frame Lines (Lucide Minimalism) -->
  <rect x="72" y="72" width="368" height="368" rx="28" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="2" stroke-dasharray="10 8" />

  <!-- Monogram "L" / Multi-Layer Artwork Structure -->
  <g filter="url(#neonGlow)">
    
    <!-- Background Offset "L" Layer (Depth Ribbon in Electric Violet) -->
    <path d="M195 120 L195 320 Q195 350 225 350 L370 350" 
          fill="none" 
          stroke="url(#violetIndigo)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.5" />

    <!-- Isometric Art Canvas Diamond in Center Background -->
    <path d="M160 240 L270 130 L380 240 L270 350 Z" 
          fill="rgba(6, 182, 212, 0.05)" 
          stroke="url(#cyanBlue)" 
          stroke-width="6" 
          stroke-dasharray="12 10" 
          opacity="0.7" />

    <!-- Main Foreground "L" Monogram (Line & Layer) in Vibrant Cyan -->
    <path d="M160 130 L160 350 C160 385 185 385 220 385 L365 385" 
          fill="none" 
          stroke="url(#cyanBlue)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Sparkling 4-point Star Accent (Top Right) -->
    <g transform="translate(365, 135)">
      <path d="M0 -32 Q0 0 32 0 Q0 0 0 32 Q0 0 -32 0 Q0 0 0 -32 Z" fill="url(#goldGlow)" />
      <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
    </g>

    <!-- Artist Precision Signature Dot (End of 'L' stroke) -->
    <circle cx="365" cy="385" r="9" fill="#ffffff" />
  </g>

  <!-- Modern Gallery Bottom Underline Accent -->
  <line x1="160" y1="432" x2="352" y2="432" stroke="url(#cyanBlue)" stroke-width="4" stroke-linecap="round" opacity="0.6" />
</svg>
