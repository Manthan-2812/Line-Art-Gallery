<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line and Layer Gallery</title>
    <meta name="description" content="Line and Layer Gallery — an interactive art portfolio with dynamic animations">
    <meta name="keywords"    content="art, portfolio, gallery, line and layer, digital art">
    <meta name="theme-color" content="#080e1d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="manifest" href="manifest.json">

    <!-- Early PWA beforeinstallprompt capture for instant 1-tap direct install -->
    <script>
        window.__deferredPwaPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            window.__deferredPwaPrompt = e;
            window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
        });
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(function(err) {
                console.log('SW registration error:', err);
            });
        }
    </script>

    <!-- Preconnect to CDNs for speed -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="preconnect" href="https://resource.trickle.so" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

    <!-- React 18 -->
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel (transpiles JSX in-browser) -->
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <!-- Framer Motion — accessed via window.Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
        <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase (compat CDN) — for live metric counters -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style type="text/tailwindcss">
    @layer base {
        /* Background is handled by the canvas in app.js — keep body transparent */
        html, body {
            background-color: #080e1d;
            color: white;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        /* Smooth scrolling for anchor links */
        html { scroll-behavior: smooth; }
        /* Hide scrollbar on WebKit while keeping scroll functionality */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    }

    @layer utilities {
        /* Tailwind doesn't generate border-white/8 by default in CDN mode — add manually */
        .border-white\/8  { border-color: rgba(255,255,255,0.08); }
        .border-white\/10 { border-color: rgba(255,255,255,0.10); }
        .border-white\/15 { border-color: rgba(255,255,255,0.15); }
    }
        /* Terms & Conditions Modal & Content Styling */
    .tac-modal-backdrop {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
    }

    .tac-modal-card {
        background-color: #ffffff !important;
        color: #000000 !important;
        max-width: 56rem;
        width: 100%;
        max-height: 88vh;
        overflow-y: auto;
        border-radius: 1.5rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        padding: 2.5rem 2rem;
    }

    .tac-modal-card h1,
    .tac-modal-card h2,
    .tac-modal-card h3 {
        color: #000000 !important;
        font-weight: 800;
    }

    .tac-modal-card p,
    .tac-modal-card li,
    .tac-modal-card > div span,
    .tac-modal-card section span {
        color: #1a1a1a !important;
    }

    .di-proceed-btn {
        background-color: #ffffff !important;
        color: #000000 !important;
        border: 2px solid #000000 !important;
        padding: 0.75rem 1.5rem !important;
        font-weight: 700 !important;
        border-radius: 0.75rem !important;
        font-size: 0.875rem !important;
        transition: all 0.2s ease !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 0.5rem !important;
        cursor: pointer !important;
    }

    .di-proceed-btn:hover {
        background-color: #000000 !important;
        color: #ffffff !important;
    }

    .di-cancel-btn {
        background-color: transparent !important;
        color: #000000 !important;
        border: 1px solid rgba(0, 0, 0, 0.2) !important;
        padding: 0.75rem 1.25rem !important;
        font-weight: 600 !important;
        border-radius: 0.75rem !important;
        font-size: 0.875rem !important;
        transition: all 0.2s ease !important;
        cursor: pointer !important;
    }

    .di-cancel-btn:hover {
        background-color: #f5f5f5 !important;
    }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Clerk (customer auth) — plain script, runs immediately & injects the SDK -->
    <script src="utils/clerk-config.js"></script>

    <!-- Load utilities first so functions are available to components -->
    <script type="text/babel" src="utils/auth.js"></script>
    <script type="text/babel" src="components/ClerkAuth.js"></script>
    <script type="text/babel" src="components/Navbar.js"></script>
    <script type="text/babel" src="components/AddressModal.js"></script>
    <script type="text/babel" src="components/OrderHistoryDrawer.js"></script>
    <script type="text/babel" src="components/TransitionOverlay.js"></script>
    <!-- Hero draggable cards + About Me pixelated portrait -->
    <script type="text/babel" src="components/DraggableCards.js"></script>
    <script type="text/babel" src="components/PixelatedCanvas.js"></script>
        <!-- Firestore helpers — live metric counters -->
    <script type="text/babel" src="utils/firebase.js"></script>
    <!-- Modals & PWA Prompts -->
    <script type="text/babel" src="components/TAC.js"></script>
    <script type="text/babel" src="components/DeliveryInstructions.js"></script>
    <script type="text/babel" src="components/PWAInstallBanner.js"></script>
    <!-- Main landing page app -->
    <script type="text/babel" src="app.js"></script>

    <!-- Register PWA Service Worker -->
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration error:', err));
        });
    }
    </script>
</body>
</html>
